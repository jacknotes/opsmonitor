global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 30s

remote_write:
  - url: http://localhost:8428/api/v1/write
    queue_config:
      # 允许的最大并发协程数，避免内存溢出
      max_shards: 200      
      # 每个分片在内存中缓存的最大样本数
      capacity: 10000      
      # 每次向远端批量发送的最大样本数
      max_samples_per_send: 10000 
      # 缓冲区满时，数据发送的最大等待时间
      batch_send_deadline: 5s
    write_relabel_configs:
      # 示例：丢弃包含高基数标签的指标
      - source_labels: [__name__]
        regex: "(container_tasks_state|container_memory_failures_total|container_network_receive_errors_total|container_network_receive_packets.*|container_network_transmit_errors_total|container_network_transmit_packets.*|container_memory_failcnt|container_blkio_device_usage_total)"
        action: drop

alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - '192.168.xxx:9093'

rule_files:
  - "/usr/local/prometheus/rules/*.rule"

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
    - targets: ['127.0.0.1:9090']
      labels:
        app: "prometheus server"

  - job_name: 'pushgateway'
    scrape_interval: 30s
    static_configs:
    - targets: ['127.0.0.1:9091']

  - job_name: 'consul-nginx_exporter'
    scrape_interval: 15s
    consul_sd_configs:
    - server: '192.168.xxx:8500'
      services: []
    relabel_configs:
      - source_labels: [__meta_consul_service]
        regex: nginx.*
        action: keep
      - regex: __meta_consul_service_metadata_(.+)
        action: labelmap
      - source_labels: [__meta_consul_service_address]
        action: replace
        target_label: ip
    metric_relabel_configs:
      # 删除高基数标签
      - action: labeldrop
        regex: 'host'
      - action: drop
        source_labels: [__name__]
        regex: 'nginx_server_cache|nginx_server_requests'

